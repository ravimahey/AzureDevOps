# ==============================================================================
# Azure DevOps Multi-Stage Release Pipeline: securemath POC
# Demonstrates: Build -> Obfuscation -> Multi-OS Test -> Signing -> Publishing
# ==============================================================================

name: $(Date:yyyyMMdd)$(Rev:.r)-$(Build.SourceBranchName)

trigger:
  branches:
    include:
      - main
      - develop
      - feature/*
      - release/*

pr:
  branches:
    include:
      - main
      - develop

parameters:
  - name: publish
    displayName: "Execute Publish Stage"
    type: boolean
    default: false

  - name: publishTarget
    displayName: "Target Package Index"
    type: string
    default: testpypi
    values:
      - testpypi
      - pypi

variables:
  pythonVersion: '3.12'
  packageName: 'securemath'
  packageVersion: '0.1.0'
  # POC mock license variables (Replace with Variable Group / Key Vault in production)
  LICENSE_KEY: 'POC-VALID-123'
  LICENSE_ENVIRONMENT: 'test'
  LICENSE_EXPIRY: '2099-12-31'
  # Uncomment in production:
  # - group: securemath-release-secrets

stages:
  # ============================================================================
  # STAGE 1: Build, Obfuscate, Validate License, and Create Wheel
  # ============================================================================
  - stage: Build
    displayName: "Stage 1 — Build & Obfuscation"
    jobs:
      - job: BuildAndPackage
        displayName: "Build, Obfuscate & Validate"
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - task: UsePythonVersion@0
            displayName: "Set Python $(pythonVersion)"
            inputs:
              versionSpec: '$(pythonVersion)'
              addToPath: true

          - script: |
              echo "=== Initializing Python Build Environment ==="
              python -m venv .venv
              source .venv/bin/activate
              python -m pip install --upgrade pip
              pip install -r requirements.txt
              pip install -r requirements-dev.txt
            displayName: "Prepare Python Environment & Dependencies"

          - script: |
              echo "=== Validating LicenseSpring Mock Integration ==="
              source .venv/bin/activate
              python scripts/validate_license.py
            displayName: "Validate License Credentials"
            env:
              LICENSE_KEY: $(LICENSE_KEY)
              LICENSE_ENVIRONMENT: $(LICENSE_ENVIRONMENT)
              LICENSE_EXPIRY: $(LICENSE_EXPIRY)

          - script: |
              echo "=== Executing PyArmor Obfuscation ==="
              source .venv/bin/activate
              # Target glibc and musl runtimes for Ubuntu, Debian, Alpine, Fedora compatibility
              python scripts/obfuscate.py --platform linux.x86_64,alpine.x86_64
            displayName: "Obfuscate Source Code with PyArmor"

          - script: |
              echo "=== Building Python Wheel Package ==="
              source .venv/bin/activate
              python scripts/build_package.py --obfuscated
            displayName: "Build Wheel Package"

          - script: |
              echo "=== Validating Artifact Integrity & Metadata ==="
              source .venv/bin/activate
              python scripts/validate_artifact.py
            displayName: "Validate Wheel Artifact"

          - task: PublishPipelineArtifact@1
            displayName: "Publish Build Artifact (securemath-build)"
            inputs:
              targetPath: '$(System.DefaultWorkingDirectory)/dist'
              artifact: 'securemath-build'
              publishLocation: 'pipeline'

  # ============================================================================
  # STAGE 2: Multi-OS Test Matrix (Ubuntu, Debian, Alpine, Fedora)
  # ============================================================================
  - stage: Test
    displayName: "Stage 2 — Multi-OS Test Matrix"
    dependsOn: Build
    jobs:
      - job: TestMatrix
        displayName: "Test Matrix"
        strategy:
          matrix:
            Ubuntu:
              containerImage: 'ubuntu:24.04'
              osName: 'Ubuntu'
            Fedora:
              containerImage: 'fedora:40'
              osName: 'Fedora'
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - task: DownloadPipelineArtifact@2
            displayName: "Download Build Artifact"
            inputs:
              buildType: 'current'
              artifactName: 'securemath-build'
              targetPath: '$(System.DefaultWorkingDirectory)/dist'

          - script: |
              echo "Pulling container image $(containerImage)..."
              docker pull $(containerImage)
              echo "Executing tests inside $(osName) container..."
              docker run --rm \
                --user 0:0 \
                -v $(System.DefaultWorkingDirectory):/workspace \
                -w /workspace \
                $(containerImage) \
                sh -c "chmod +x scripts/run_multi_os_tests.sh && ./scripts/run_multi_os_tests.sh dist tests"
            displayName: "Execute Multi-OS Test Suite ($(osName))"

          - task: PublishTestResults@2
            displayName: "Publish Test Results for $(osName)"
            condition: always()
            inputs:
              testResultsFormat: 'JUnit'
              testResultsFiles: '$(System.DefaultWorkingDirectory)/test-results/*.xml'
              testRunTitle: '$(osName) Container Test Run'
              failTaskOnFailedTests: true

  # ============================================================================
  # STAGE 3: Artifact Signing & Signature Verification
  # ============================================================================
  - stage: Sign
    displayName: "Stage 3 — Artifact Signing"
    dependsOn: Test
    condition: |
      and(
        succeeded(),
        or(
          eq(variables['Build.SourceBranch'], 'refs/heads/main'),
          startsWith(variables['Build.SourceBranch'], 'refs/heads/release/'),
          eq('${{ parameters.publish }}', 'true')
        )
      )
    jobs:
      - job: SignArtifacts
        displayName: "Sign and Verify Wheel Artifact"
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - task: UsePythonVersion@0
            displayName: "Set Python $(pythonVersion)"
            inputs:
              versionSpec: '$(pythonVersion)'
              addToPath: true

          - task: DownloadPipelineArtifact@2
            displayName: "Download Build Artifact"
            inputs:
              buildType: 'current'
              artifactName: 'securemath-build'
              targetPath: '$(System.DefaultWorkingDirectory)/dist'

          - script: |
              echo "=== Initializing Signing Tools ==="
              pip install cryptography
              echo "Target artifacts in dist:"
              ls -la dist/
            displayName: "Prepare Signing Environment"

          - script: |
              echo "=== Executing Artifact Digital Signing ==="
              # In production: Replaced by Azure Key Vault HSM / Azure SignTool
              python scripts/sign_artifact.py dist/*.whl
            displayName: "Digitally Sign Artifacts"
            env:
              SIGNING_PRIVATE_KEY: $(SIGNING_PRIVATE_KEY)

          - script: |
              echo "=== Verifying Digital Signature & Checksum ==="
              chmod +x scripts/verify_signature.sh
              ./scripts/verify_signature.sh dist/*.whl
            displayName: "Validate Artifact Signature"

          - task: PublishPipelineArtifact@1
            displayName: "Publish Signed Artifact (securemath-signed)"
            inputs:
              targetPath: '$(System.DefaultWorkingDirectory)/dist'
              artifact: 'securemath-signed'
              publishLocation: 'pipeline'

  # ============================================================================
  # STAGE 4: PyPI / TestPyPI Publishing
  # ============================================================================
  - stage: Publish
    displayName: "Stage 4 — Package Publishing"
    dependsOn: Sign
    condition: |
      and(
        succeeded(),
        or(
          eq('${{ parameters.publish }}', 'true'),
          startsWith(variables['Build.SourceBranch'], 'refs/heads/release/')
        )
      )
    jobs:
      - job: PublishToRepository
        displayName: "Publish Package to Repository"
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - task: UsePythonVersion@0
            displayName: "Set Python $(pythonVersion)"
            inputs:
              versionSpec: '$(pythonVersion)'
              addToPath: true

          - task: DownloadPipelineArtifact@2
            displayName: "Download Signed Artifact"
            inputs:
              buildType: 'current'
              artifactName: 'securemath-signed'
              targetPath: '$(System.DefaultWorkingDirectory)/dist'

          - script: |
              pip install twine
              echo "Verifying package distribution archives with twine check..."
              PKG_FILES=$(ls dist/*.whl dist/*.tar.gz 2>/dev/null || ls dist/*.whl)
              echo "Target distribution packages: $PKG_FILES"
              twine check $PKG_FILES
            displayName: "Inspect and Validate Package with Twine"

          - script: |
              echo "=== PyPI / TestPyPI Release Upload ==="
              TARGET="${{ parameters.publishTarget }}"
              echo "Configured Target Index: $TARGET"

              if [ "$TARGET" = "pypi" ]; then
                REPO_URL="https://upload.pypi.org/legacy/"
              else
                REPO_URL="https://test.pypi.org/legacy/"
              fi

              PKG_FILES=$(ls dist/*.whl dist/*.tar.gz 2>/dev/null || ls dist/*.whl)

              if [ -z "${PYPI_API_TOKEN:-}" ] || [ "${PYPI_API_TOKEN}" = '$(PYPI_API_TOKEN)' ]; then
                echo "WARNING: PYPI_API_TOKEN is not configured in pipeline secrets."
                echo "POC Simulated Run: Twine package inspection completed successfully."
                echo "Target packages to upload when token is supplied:"
                echo "$PKG_FILES"
                echo "To publish live packages, configure PYPI_API_TOKEN in Azure DevOps secret variables."
              else
                echo "Uploading packages to $REPO_URL..."
                twine upload \
                  --repository-url "$REPO_URL" \
                  -u __token__ \
                  -p "$PYPI_API_TOKEN" \
                  --non-interactive \
                  $PKG_FILES
              fi
            displayName: "Upload Package to ${{ parameters.publishTarget }}"
            env:
              PYPI_API_TOKEN: $(PYPI_API_TOKEN)

          - script: |
              echo "============================================================"
              echo "Release Notification"
              echo "============================================================"
              echo "Package:       $(packageName) $(packageVersion)"
              echo "Build Number:  $(Build.BuildNumber)"
              echo "Commit SHA:    $(Build.SourceVersion)"
              echo "Branch:        $(Build.SourceBranch)"
              echo "Target:        ${{ parameters.publishTarget }}"
              echo "Status:        RELEASE SUCCESSFUL"
              echo "============================================================"
              # Webhook / Teams / Slack notification endpoint integration point
            displayName: "Dispatch Release Notification Placeholder"